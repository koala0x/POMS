# dictionaries/tickers.yaml
#
# 目的：
#   把原 `services/prefilter.py` 里硬编码的 COIN_KEYWORDS_EN（60+）和
#   COIN_KEYWORDS_ZH（7）全部外置为 YAML，让 prefilter 与 Entity_Extractor
#   共享同一份数据，后续扩充不用改代码。
#
# Schema（参考 dictionaries/loader.py）：
#   <TICKER_NAME>:
#     type:    layer1 / defi / meme / layer2 / stablecoin / privacy / brc20 / legacy / us_stock
#                (加载后存为 DictionaryEntry.category，Phase 1 只存不用，
#                 entity_type 固定由所在文件决定，恒为 "ticker")
#     aliases: [别名1, 别名2, ...]   # 可选；中英文混合都行
#
# 匹配规则（由 prefilter.py + Entity_Extractor 协同实现）：
#   - 英文名（如 BTC）：non-alnum 边界匹配，case-insensitive
#   - 中文别名（如 比特币）：substring match
#   - 英文别名（如 bitcoin）：进入 alias_index 后也走 substring match
#
# Phase 1 约束：
#   - 本文件严格只含 prefilter.py 里已有的词条，不扩充（Gate 1 观测后再加）
#   - 冷启动期若要加词，直接编辑这里并重启服务即可

