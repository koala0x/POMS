[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poms"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["psycopg[binary]"]

[project.scripts]
poms-worker = "poms.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
