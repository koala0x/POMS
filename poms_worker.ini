; POMS Worker 配置文件（INI，支持注释）
; 使用方式：
;   python3 /home/alex/Work/Crypto/POMS/poms_worker.py --config /home/alex/Work/Crypto/POMS/poms_worker.ini run
;
; 优先级：
;   环境变量 > 本 INI 文件 > 代码内默认值
;   例如你同时设置了 POMS_OLLAMA_MODEL，那么会覆盖 [ollama] model

[postgres]
; Postgres 连接串（建议不要把真实密码提交到代码库里）
; 例：dsn = postgresql://user:pass@127.0.0.1:5432/your_db
dsn = postgresql://all_new:all_new@127.0.0.1:5432/all_new

[ollama]
; 本地 Ollama 服务地址
base_url = http://localhost:11434
; 你本地运行的千问模型名（以 ollama list 显示为准）
model = qwen2.5
; 单次请求超时（秒）
timeout_s = 120

[worker]
; 每累计多少条原始数据触发一次归纳（默认 50）
batch_size = 50
; 轮询源表增量的间隔（秒）
poll_interval_s = 5
; 每次从源表最多拉取多少条（>= batch_size 更合适）
fetch_limit = 200
; 是否启用“每小时二次提炼”（true/false）
hourly_enabled = true

[sources]
; 启用哪些源表（逗号分隔）。
; 留空表示启用所有 [source.<name>] 段落。
enabled = gmgn_twitter, binance_square_news

; 每个数据源使用一个段落：source.<name>
; 字段说明：
; - table：表名
; - id_column：自增主键列名（用于增量拉取）
; - text_column：正文列名（喂给大模型的文本）
; - created_at_column：可选，时间列名（仅用于提示词显示）

[source.gmgn_twitter]
table = gmgn_tweets
id_column = id
text_column = content
created_at_column = created_at

[source.binance_square_news]
table = binance_square_news
id_column = id
text_column = content
created_at_column = created_at

